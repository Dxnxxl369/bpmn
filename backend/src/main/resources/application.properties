spring.data.mongodb.uri=mongodb://localhost:27017/gestion_tramites_uml_db
server.port=8080
server.address=0.0.0.0

# AWS S3 Configuration
aws.accessKey=YOUR_AWS_ACCESS_KEY
aws.secretKey=YOUR_AWS_SECRET_KEY
aws.region=us-east-1
aws.bucketName=uagrm-tramites-bucket

# Limites de tamano para documentos y avatares
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
server.max-http-header-size=2MB

# Groq Cloud
groq.api.key=YOUR_GROQ_API_KEY

# Hugging Face (Professional Vision Models)
hf.api.key=YOUR_HF_API_KEY

# Logs
logging.level.org.springframework.data.mongodb=DEBUG
